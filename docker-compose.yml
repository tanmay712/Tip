version: "3.8"

services:
  hodlr:
    build: .
    container_name: hodlr-bot
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - hodlr-data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/hodlr.db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  hodlr-data:
